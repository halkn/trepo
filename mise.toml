# The toolchain development and CI run on. go.mod carries the language version
# trepo compiles against, which is a floor for whoever installs it and moves for
# a different reason, so the two are not copies of one another.
[tools]
go = "1.26.6"
golangci-lint = "2.12.2"

[tasks.test]
description = "run the test suite"
# -race by default: checkouts are listed one repository per goroutine, so a
# data race here is a real failure mode rather than a hypothetical one.
run = "go test -race ./..."

[tasks.cover]
description = "run the test suite and report coverage per package"
run = "go test -race -cover ./..."

[tasks.lint]
depends = ["lint:fmt", "lint:tidy", "lint:go"]
description = "format check, module check and linters"

[tasks."lint:fmt"]
hide = true
run = '''
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  printf 'not gofmt-ed:\n%s\n' "$unformatted" >&2
  exit 1
fi
'''

# go.mod and go.sum are the record of trepo depending on nothing outside the
# standard library, so drift in them is worth failing over.
[tasks."lint:tidy"]
hide = true
run = "go mod tidy -diff"

[tasks."lint:go"]
hide = true
run = "golangci-lint run"

[tasks.fmt]
description = "format the source"
run = "gofmt -w ."

[tasks.build]
description = "build the trepo binary"
run = "go build -o trepo ./cmd/trepo"

# Only the Go toolchain itself is in scope: trepo has no module dependencies to
# audit, so a finding here means the toolchain needs upgrading.
#
# Pinned rather than @latest so a run is reproducible, and fetched with `go run`
# rather than a tool directive so that go.mod keeps saying trepo depends on
# nothing.
[tasks.audit]
description = "check the toolchain for known vulnerabilities"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./..."

# The archive layout and the platform list are here rather than in the release
# workflow so that a release can be reproduced locally with the same command CI
# runs. Version comes from the tag Go stamps into the binary, so nothing needs
# -ldflags to keep `trepo version` honest.
[tasks.dist]
description = "build the release archives and their checksums into dist/"
run = '''
set -eu
version=${VERSION:-$(git describe --tags --always)}
rm -rf dist
mkdir -p dist
for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
  os=${target%/*}
  arch=${target#*/}
  name="trepo_${version}_${os}_${arch}"
  mkdir -p "dist/$name"
  GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -o "dist/$name/trepo" ./cmd/trepo
  cp LICENSE README.md "dist/$name/"
  tar -czf "dist/$name.tar.gz" -C dist "$name"
  rm -rf "dist/$name"
done
cd dist && shasum -a 256 *.tar.gz > "trepo_${version}_checksums.txt"
'''
